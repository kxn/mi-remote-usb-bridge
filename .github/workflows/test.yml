name: Host regression
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          install: make mingw-w64-clang-x86_64-clang
      - name: C tests and simulator
        shell: msys2 {0}
        run: |
          make CC=clang AR=llvm-ar test reference-test sim
          cygpath -w /clang64/bin >> "$GITHUB_PATH"
      - run: python -m pip install -r demo/requirements.txt
      - name: Python and contract tests
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $tests = @('tests/test_release_firmware.py','tests/test_rbp_python.py','tests/test_worker_races.py','tests/test_serial_transport.py','tests/test_srv_budget.py','tests/test_e2e.py','tests/test_demo.py','tests/test_diag.py','protocol/v3/check_contract.py','tools/check_design.py')
          foreach ($test in $tests) {
            python $test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
